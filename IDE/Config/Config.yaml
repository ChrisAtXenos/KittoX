DefaultDBConnections:
  DBX:
    Connection:
      DriverName: Firebird
      DataBase: localhost:Path\to\database.fdb
      User_Name: SYSDBA
      Password: masterkey
      ServerCharSet: UTF8
      WaitOnLocks: True
      IsolationLevel: ReadCommitted
      Trim Char: False
  FD:
    Connection:
      DriverID: FB
      Database: Path\to\database.fdb
      User_Name: SYSDBA
      Password: masterkey
      Server: localhost
      CharacterSet: UTF8
      Protocol: TCPIP
      Isolation: ReadCommitted
