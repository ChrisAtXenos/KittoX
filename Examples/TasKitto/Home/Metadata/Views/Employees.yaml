Type: Data
IsLookup: True
Controller: List
  Width: 1000
  Height: 600
  Filters:
    DisplayLabel: _(Employee Filter)
    Items:
      FreeSearch: _(Search Name)
        # ExpressionTemplate should contain a {value} placeholder for the search term.
        ExpressionTemplate: >
          upper(EMPLOYEE_NAME) like upper('%{value}%')
  # The form of the current record beside the grid: the List keeps it on the
  # selected row, in view mode; Edit and Save happen in place.
  EastController: Form
    Width: 450
    Split: True
    NorthController: StatusBar
      ImageName: visibility
      Text: Current record values

MainTable:
  Model: EMPLOYEE
  Fields:
    EMPLOYEE_ID:
    EMPLOYEE_NAME:
    EMPLOYEE_TYPE:
  Controller:
    AutoOpen: True
