ModelName: PHASE
DisplayLabel: _(Phase)
PluralDisplayLabel: _(Phases)
ImageName: schedule
Fields:
  PHASE_ID: String(32) not null primary key
    IsVisible: False
    DefaultValue: %COMPACT_GUID%
  PHASE_NAME: String(40) not null
    DisplayLabel: _(Phase Name)
    DisplayWidth: 20
  PROJECT: Reference(PROJECT) not null
    DisplayLabel: _(Project)
    Fields:
      PROJECT_ID:
  START_DATE: Date
    DisplayLabel: _(Start Date)
  END_DATE: Date
    DisplayLabel: _(End Date)
  STATUS: String(12)
    DisplayLabel: _(Status)
    AllowedValues:
      Started: _(Started)
      Finished: _(Finished)
      Invoiced: _(Invoiced)
      Killed: _(Killed)
      Waiting: _(Waiting)
DefaultSorting: {Q}START_DATE
Rules:
  # Auto-calculates START_DATE for new records.
  DefaultPhaseStartTime:
  # Makes sure that dates, if specified, are consistent.
  EnforceRange:
    From: START_DATE
    To: END_DATE
