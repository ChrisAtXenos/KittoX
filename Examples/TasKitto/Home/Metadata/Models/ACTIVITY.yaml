ModelName: ACTIVITY
DisplayLabel: _(Activity)
PluralDisplayLabel: _(Activities)
ImageName: task
Fields:
  ACTIVITY_ID: String(32) not null primary key
    IsVisible: False
    DefaultValue: %COMPACT_GUID%
  DESCRIPTION: String(80) not null
    DisplayLabel: _(Description)
    DisplayWidth: 50
    Hint: _(Insert the activity description)
  PHASE: Reference(PHASE) not null
    DisplayLabel: _(Phase)
    Fields:
      PHASE_ID:
    Hint: _(Select Phase)
  EMPLOYEE: Reference(EMPLOYEE) not null
    DisplayLabel: _(Employee)
    Fields:
      EMPLOYEE_ID:
    Hint: _(Search and select the Employee)
  ROLE: Reference(OPERATOR_ROLE) not null
    DisplayLabel: _(Role)
    Fields:
      ROLE_ID:
    Hint: _(Select the Role)
  TYPE: Reference(ACTIVITY_TYPE) not null
    DisplayLabel: _(Type)
    Fields:
      TYPE_ID:
    Hint: _(Select the Activity Type)
  ACTIVITY_DATE: Date not null
    DisplayLabel: _(Activity Date)
    NotifyChange: True
    Hint: _(Date)
  START_TIME: Time
    DisplayLabel: _(Start Time)
    NotifyChange: True
    Hint: _(Start)
    Rules:
      ActivityRules:    
  END_TIME: Time
    DisplayLabel: _(End Time)
    Hint: _(End)
  STATUS: String(12)
    DisplayLabel: _(Status)
    DisplayWidth: 10
    Hint: _(Select status)
    AllowedValues:
      Inserted: _(Inserted)
      Approved: _(Approved)
      Billed: _(Billed)
      NotBillable: _(Not Billable)
      Internal: _(Internal)
      Done: _(Done)
  DURATION: Float
    DisplayLabel: _(Duration)
    DisplayWidth: 8
    Expression: |
      case
        when ({Q}START_TIME is null) or ({Q}END_TIME is null) then 0
        else CAST(%DB.DATEDIFF(SECOND, {Q}START_TIME, {Q}END_TIME)% / 3600.0 AS DECIMAL(8,4))
      end
Rules:
  ActivityRules:
  EnforceRange:
    From: START_TIME
    To: END_TIME
DefaultSorting: ACTIVITY.ACTIVITY_DATE DESC, ACTIVITY.START_TIME DESC
