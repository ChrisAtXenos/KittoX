ModelName: EMPLOYEE
DisplayLabel: _(Employee)
PluralDisplayLabel: _(Employees)
ImageName: group
IsLarge: True
Fields:
  EMPLOYEE_ID: String(32) not null primary key
    IsVisible: False
    DefaultValue: %COMPACT_GUID%
  EMPLOYEE_NAME: String(40) not null
    DisplayLabel: _(Employee Name)
    DisplayWidth: 20
  EMPLOYEE_TYPE: String(20)
    DisplayLabel: _(Employee Type)
    AllowedValues:
      SYSTEM: _(System Operator)
      ACCT: _(Accountant)
      PROG: _(Programmer)
      PROJ_MGR: _(Project Manager)
      AN_PROG: _(Analyst Programmer)
