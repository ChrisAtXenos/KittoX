<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- The green figure comes first so it paints underneath the other two: SVG
       has no z-index, document order is the stacking order. Its coordinates are
       untouched, so it sits exactly where it did. -->
  <circle cx="24" cy="10" r="5" fill="#43A047"/>
  <path fill="#2E7D32" d="M16 26c0-4.4 3.6-8 8-8s8 3.6 8 8v2H16v-2z"/>
  <circle cx="14" cy="16" r="6" fill="#1976D2"/>
  <path fill="#1565C0" d="M3 34c0-5.5 4.9-10 11-10s11 4.5 11 10v3H3v-3z"/>
  <circle cx="34" cy="16" r="6" fill="#E53935"/>
  <path fill="#C62828" d="M23 34c0-5.5 4.9-10 11-10s11 4.5 11 10v3H23v-3z"/>
  <circle cx="40" cy="40" r="6" fill="#FFB300"/>
  <text x="40" y="44" font-family="Arial,sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#5D4037">★</text>
</svg>
