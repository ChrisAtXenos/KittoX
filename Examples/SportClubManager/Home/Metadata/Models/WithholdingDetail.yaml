ModelName: WithholdingDetail
PhysicalName: DETTAGLI_RITENUTE
DefaultSorting: {Q}DX
PluralDisplayLabel: _(Withholding taxes)
DisplayLabel: _(Withholding tax)
PluralModelName: WithholdingDetails
Fields:
  Id: String(32) not null primary key
    PhysicalName: ID
    DisplayLabel: _(Withholding code)
  Description: String(200) not null
    PhysicalName: DX
    DisplayLabel: _(Additional description)
    DisplayWidth: 40
  PostingDate: DateTime
    PhysicalName: DT_REG
    DisplayLabel: _(Accrual date)
    DisplayWidth: 15
  FeePaymentDate: DateTime
    PhysicalName: DT_COMP
    DisplayLabel: _(Fee payment date)
    DisplayWidth: 15
  TaxLevyCode: String(6)
    PhysicalName: COD_TRIBUTO
    DisplayLabel: _(Tax levy code)
  FeeAmount: Currency
    PhysicalName: IMP_COMPENSO
    DisplayLabel: _(Fee amount)
    DisplayWidth: 10
  TaxableAmount: Currency
    PhysicalName: IMPONIBILE
    DisplayLabel: _(Taxable amount)
    DisplayWidth: 10
  AmountNotSubjectToWithholding: Currency
    PhysicalName: IMP_NON_SOGG_RA
    DisplayLabel: _(Amount not subject to withholding)
    DisplayWidth: 10
  AmountSubjectToWithholding: Currency
    PhysicalName: IMP_SOGG_RA
    DisplayLabel: _(Withholding tax amount)
    DisplayWidth: 10
  DueDate: DateTime
    PhysicalName: DT_SCAD
    DisplayLabel: _(Payment due date)
    DisplayWidth: 15
  DepositDate: DateTime
    PhysicalName: DT_VERS
    DisplayLabel: _(Deposit date)
    DisplayWidth: 15
  SocialSecurityActivityCode: String(2)
    PhysicalName: COD_ATT_INPS
    DisplayLabel: _(Social security activity code)
  WithholdingType: String(5)
    PhysicalName: TIPO_RITENUTA
    DisplayLabel: _(Withholding type)
    AllowedValues:
      INPS: _(Social security)
      IRPEF: _(Income tax)
  Status: String(1)
    PhysicalName: STATUS
    DisplayLabel: _(Withholding status)
    DisplayWidth: 30
    AllowedValues:
      P: _(Payment)
      F: _(Invoice)
      V: _(Remitted)
      C: _(Certified)
      S: _(Accrual)
  Bank: Reference(Bank)
    PhysicalName: FK_DETTAGLI_RITENUTE_BANCA_VERSAMENTO
    DisplayLabel: _(Deposit bank)
    DisplayWidth: 40
    Fields:
      DepositBankId:
        PhysicalName: BANCA_VERSAMENTOID
  PaymentMethod: Reference(PaymentMethod)
    PhysicalName: FK_DETTAGLI_RITENUTE_MOD_LIQUIDAZIONE
    DisplayLabel: _(Settlement method)
    Fields:
      SettlementMethodId:
        PhysicalName: MOD_LIQUIDAZIONEID
  AccountingEntry: Reference(AccountingEntry)
    PhysicalName: FK_DETTAGLI_RITENUTE_MOVIMENTO
    DisplayLabel: _(Entry)
    Fields:
      AccountingEntryId:
        PhysicalName: MOVIMENTOID
  Supplier: Reference(Supplier)
    PhysicalName: FK_DETTAGLI_RITENUTE_FORNITORE
    DisplayLabel: _(Supplier)
    DisplayWidth: 40
    Fields:
      SupplierId:
        PhysicalName: FORNITOREID
  FinancialYear: String(200)
    Expression: (SELECT EC.DX FROM ESERCIZICONTABILI EC WHERE EC.ID =  FK_DETTAGLI_RITENUTE_MOVIMENTO.ESERCID)
    DisplayLabel: _(Financial Year)
    DisplayWidth: 15
ImageName: attach_money
