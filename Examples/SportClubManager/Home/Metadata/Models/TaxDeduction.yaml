    DisplayWidth: 25
  FirstName: String(100)
    DisplayLabel: _(First Name)
    PhysicalName: NOME
    DisplayWidth: 25
  TaxCode: String(16)
    DisplayLabel: _(Tax Code)
    PhysicalName: CODFISC
    DisplayWidth: 20
  Address: String(50)
    DisplayLabel: _(Address)
    PhysicalName: INDIRIZZO
  PostalCode: String(5)
    DisplayLabel: _(Postal Code)
    PhysicalName: CAP
  Municipality: String(200)
    DisplayLabel: _(Municipality)
    PhysicalName: COMUNE
  ProvinceId: String(2)
    PhysicalName: PROVINCIAID
    DisplayLabel: _(Province)
  Province: String(200)
    PhysicalName: PROVINCIA
    DisplayLabel: _(Province)
  DeductionPercent: Integer
    PhysicalName: PERC_DETRAZIONI
    DisplayLabel: _(% deduction)
    DisplayWidth: 15
  SubscriberLastName: String(100)
    PhysicalName: ISCR_COGNOME
    DisplayLabel: _(Subscriber last name)
    DisplayWidth: 25
  SubscriberFirstName: String(100)
    PhysicalName: ISCR_NOME
    DisplayLabel: _(Subscriber first name)
    DisplayWidth: 25
  SubscriberBirthDate: DateTime
    PhysicalName: ISCR_DATANASC
    DisplayLabel: _(Subscriber date of birth)
    DisplayWidth: 20
  SubscriberBirthMunicipality: String(200)
    PhysicalName: ISCR_COMUNENASC
    DisplayLabel: _(Subscriber birth municipality)
    DisplayWidth: 25
  SubscriberBirthProvinceId: String(2)
    PhysicalName: ISCR_PROVNASCID
    DisplayLabel: _(Subscriber province code)
    DisplayWidth: 25
  SubscriberBirthProvince: String(200)
    PhysicalName: ISCR_PROVNASC
    DisplayLabel: _(Subscriber province)
    DisplayWidth: 25
  SubscriberTaxCode: String(16)
    PhysicalName: ISCR_CODFISC
    DisplayLabel: _(Subscriber tax code)
    DisplayWidth: 20
  PaidAmount: Currency
    PhysicalName: IMPORTOPAGATO
    DisplayLabel: _(Amount paid)
    DisplayWidth: 10
  AmountPercent: Currency
    PhysicalName: IMPORTO_PERC
    DisplayLabel: _(Amount %)
    DisplayWidth: 10
  Number: Integer
    PhysicalName: NUMERO
    DisplayLabel: _(Receipt no.)
    DisplayFormat: 0
    EditFormat: 0
    DisplayWidth: 10
  Year: Integer
    PhysicalName: ANNO
    DisplayLabel: _(Year)
    DisplayFormat: 0
    EditFormat: 0
    DisplayWidth: 10
  PrintDate: DateTime
    PhysicalName: DATA_STAMPA
    DisplayLabel: _(Print date)
  DocumentFile: FileReference(50)
    PhysicalName: FILE_DOCUMENTO
    FileNameField: OriginalFileName
    DisplayLabel: _(Scan)
    MaxUploadSize: 1MB
    PreviewWindow: True
      Width: 226
      Height: 320
    Path: %Config:UploadPath%DetrazioniFiscali
    DisplayWidth: 40
  OriginalFileName: String(200)
    PhysicalName: NOME_FILE_ORIGINALE
    DisplayWidth: 40
    DisplayLabel: _(Original File Name)
    IsReadOnly: True
    IsVisible: False
  PaymentMethod: String(200)
    PhysicalName: MOD_PAGAMENTO
    DisplayLabel: _(Payment method)
    DisplayWidth: 25
  CampaignDescription: String(200)
    PhysicalName: DESC_CAMPAGNA
    DisplayLabel: _(Subscription campaign description)
    DisplayWidth: 30
  PresidentLastName: String(100)
    PhysicalName: PRES_COGNOME
    DisplayLabel: _(Last Name)
    DisplayWidth: 25
  PresidentFirstName: String(100)
    PhysicalName: PRES_NOME
    DisplayLabel: _(First Name)
    DisplayWidth: 25
  Person: Reference(Person)
    PhysicalName: DT_DETRAZIONI_FISCALI_NOMINATIVO
    DisplayLabel: _(Parent Name)
    Fields:
      PersonId:
        PhysicalName: NOMINATIVOID
    AutoAddFields:
      Email: Person_Email
      CardNumber: Person_CardNumber
  PaymentDate: DateTime
    PhysicalName: DATA_PAGAMENTO
    DisplayLabel: _(Payment date)
