ModelName: TaxDeduction
PhysicalName: DETRAZIONI_FISCALI
DefaultSorting: {Q}COGNOME
PluralDisplayLabel: _(Receipts/Deductions)
DisplayLabel: _(Receipt/Deduction)
PluralModelName: TaxDeductions
ImageName: monetization_on
Fields:
  Id: String(32) not null primary key
    PhysicalName: ID
    IsVisible: False
    DefaultValue: %COMPACT_GUID%
    DisplayLabel: _(Id)
  Description: String(200) not null
    PhysicalName: DX
    IsVisible: False
  LastName: String(100)
    DisplayLabel: _(Last Name)
