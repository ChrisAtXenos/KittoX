ModelName: Customer
PhysicalName: CLIENTI
DefaultSorting: {Q}DX
PluralDisplayLabel: _(Customers)
DisplayLabel: _(Customer)
PluralModelName: Customers
Rules:
  CustomerSupplierCheck:
Fields:
  Id: String(32) not null primary key
    PhysicalName: ID
    IsReadOnly: True
    DisplayLabel: _(Code)
  Description: String(200) not null
    PhysicalName: DX
    DisplayLabel: _(Company name)
    DisplayWidth: 50
  LastName: String(100)
    DisplayLabel: _(Last Name)
    PhysicalName: COGNOME
    DisplayWidth: 25
    Rules:
      CalcDescription: {LastName} {FirstName}
  FirstName: String(100)
    DisplayLabel: _(First Name)
    PhysicalName: NOME
    DisplayWidth: 25
    Rules:
      CalcDescription: {LastName} {FirstName}
  TaxCode: String(16)
    PhysicalName: CODFISCALE
    DisplayWidth: 25
    DisplayLabel: _(Tax code)
    Rules:
      ForceUpperCase:
      CheckFieldDupValue:
      CheckTaxCodeFormat:
      CheckTaxCodeChecksum:
      CustomerSupplierSetDataFromTaxCode:
  #SetRegistryDataFromTaxCode:
  VatNumber: String(11)
    PhysicalName: PARTIVA
    DisplayWidth: 25
    DisplayLabel: _(VAT Number)
    Rules:
      ForceUpperCase:
      CheckFieldDupValue:
      CheckVatNumberFormat:
  Address: String(50)
    PhysicalName: INDIRIZZO
    DisplayWidth: 50
    DisplayLabel: _(Address)
    NotifyChange: True
  PostalCode: String(5)
    PhysicalName: CAP
    DisplayWidth: 5
    DisplayLabel: _(Postal Code)
    NotifyChange: True
  Iban: String(27)
    PhysicalName: IBAN
    DisplayLabel: _(IBAN)
    Rules:
      ForceUpperCase:
      CheckIBAN:
  EInvoiceCode: String(7)
    PhysicalName: CODICE_FATT_ELE
    DisplayLabel: _(Unique code)
    DisplayWidth: 15
  Email: String(50)
    PhysicalName: EMAIL
    DisplayLabel: _(E-mail)
    DisplayWidth: 40
  CertifiedEmail: String(50)
    PhysicalName: EMAIL_PEC
    DisplayLabel: _(Certified e-mail)
    DisplayWidth: 40
  AdminAddress: String(50)
    PhysicalName: INDIRIZZO_AMM
    DisplayLabel: _(Address)
  AdminPostalCode: String(5)
    PhysicalName: CAP_AMM
    DisplayLabel: _(Postal Code)
  AdminAddressSameAsRegistered: Boolean
    PhysicalName: FLAG_INDI_AMM
    DisplayLabel: _(administrative address = registered address)
    Rules:
      CustomerSupplierSetAdminOfficeFlag:
  Phone: String(30)
    PhysicalName: TELEFONO
    DisplayLabel: _(Phone)
  Mobile: String(30)
    PhysicalName: CELLULARE
    DisplayLabel: _(Mobile)
  ContactPersonName: String(200)
    PhysicalName: PERSONA_RIF
    DisplayLabel: _(Contact person)
  Bank: String(50)
    PhysicalName: BANCA
    DisplayLabel: _(Bank)
  AdminMunicipality: Reference(Municipality)
    PhysicalName: FK_CLIENTI_COMUNE_AMM
    DisplayLabel: _(Municipality)
    Fields:
      AdminMunicipalityId:
        PhysicalName: COMUNE_AMMID
    Rules:
      CalcProvince:
    LookupFilter: (COMUNI.ESTINTO = 'N')
  Municipality: Reference(Municipality)
    PhysicalName: FK_CLIENTI_COMUNE
    DisplayLabel: _(Municipality)
    NotifyChange: True
    Fields:
      MunicipalityId:
        PhysicalName: COMUNEID
    Rules:
      CalcProvince:
    NotifyChange: True
    LookupFilter: (COMUNI.ESTINTO = 'N')
  AdminProvince: Reference(Province)
    PhysicalName: FK_CLIENTI_PROVINICIA_AMM
    DisplayLabel: _(Province)
    Fields:
      AdminProvinceId:
        PhysicalName: PROVINCIA_AMMID
  Province: Reference(Province)
    PhysicalName: FK_FCLIENTI_PROVINCIA
    DisplayLabel: _(Province)
    NotifyChange: True
    Fields:
      ProvinceId:
        PhysicalName: PROVINCIAID
    NotifyChange: True
  LegalForm: Reference(LegalForm) not null
    PhysicalName: FK_CLIENTI_FORMA_GIURI
    DisplayLabel: _(Legal form)
    Fields:
      LegalFormId:
        PhysicalName: FORMA_GIURIID
    AutoAddFields:
      RequiresTaxCode: LegalForm_RequiresTaxCode
      RequiresVatNumber: LegalForm_RequiresVatNumber
      IsNaturalPerson: LegalForm_IsNaturalPerson
ImageName: perm_identity
