DisplayLabel: _(Document Management)
Type: Data
Controller: List
  Filters:
    DisplayLabel: _(Document filter)
    Connector: and
    Items:
      FreeSearch: _(Person)
        ExpressionTemplate: (DT_DOCUMENTI_NOMINATIVO.COGNOME like '%{value}%') or (DT_DOCUMENTI_NOMINATIVO.NOME like '%{value}%')
MainTable:
  Model: Document
  IsLarge: False
  DefaultFilter: {Q}NOMINATIVOID in (SELECT NOMINATIVO_ID FROM V_NUCLEO_FAMIGLIARE WHERE CREATORE_CODFISC = '%Auth:USER_NAME%')
  Controller:
    PopupWindow:
      Width: 400
      Height: 700
    Form:
      Layout: USER_Documents_Form
    Grid:
      ForceFit: True
      Layout: USER_Documents_Grid
    AllowViewing: True
