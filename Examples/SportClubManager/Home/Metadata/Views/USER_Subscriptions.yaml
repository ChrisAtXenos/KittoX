Type: Data
Controller: List
  Filters:
    DisplayLabel: _(Subscription Filter)
    Connector: and
    Items:
      ButtonList: _(Season)
        Items:
          Current: _(Current)
            Expression: {Q}STAGIONEID IN (SELECT ID FROM STAGIONE WHERE DATAINI < CURRENT_TIMESTAMP AND DATAFINE >= CURRENT_TIMESTAMP )
            IsDefault: True
          Past: _(Past)
            Expression: {Q}STAGIONEID IN (SELECT ID FROM STAGIONE WHERE DATAFINE < CURRENT_TIMESTAMP )
      FreeSearch: _(Person)
        ExpressionTemplate: (ISCRIZIONI.COGNOME like '%{value}%') or (ISCRIZIONI.NOME like '%{value}%')
MainTable:
  Model: Subscription
  IsLarge: False
  DefaultFilter: FK_ISCRIZIONI_NOMINATIVO.ID in (SELECT NOMINATIVO_ID FROM V_NUCLEO_FAMIGLIARE WHERE CREATORE_CODFISC = '%Auth:USER_NAME%')
  #IsReadOnly: True
  PluralDisplayLabel: _(Subscription summary)
  PluralModelName: SubscriptionSummary
  Rules:
    SubscriptionCheckForEditing:
  Controller:
    AllowDuplicating: False
    AllowInsert: False
    AllowViewing: True
    PreventAdding: True
    Grid:
      ForceFit: True
      Layout: USER_Subscriptions_Grid
    Form:
      Layout: USER_Subscriptions_Form
  DetailTables:
    Table:
      Model: SubscriptionInstalment
      isReadOnly: True
      Controller:
        PopupWindow:
          Width: 900
          Height: 600
        Grid:
          ForceFit: True
          Layout: USER_SubscriptionInstalments_Grid
        Grouping:
          FieldName: DueDate
          SortFieldNames: DueDate
          EnableMenu: False
          StartCollapsed: False
          ShowName: False
          ShowCount: True
            Template: {text} - _(Total) €: {[sumValues(values.rs, "TotalAmount")]}
        Form:
          Layout: USER_SubscriptionInstalments_Form
