Type: Data
Controller: List
  Filters:
    DisplayLabel: _(Search Users)
    Items:
      FreeSearch: _(Free search)
        IsRequired: True
        ExpressionTemplate: (APPUSER.ID like '%{value}%') or (APPUSER.LAST_NAME like '%{value}%') or (APPUSER.FIRST_NAME like '%{value}%') or (APPUSER.EMAIL_ADDRESS like '%{value}%') or (APPUSER.PHONE_NUMBER like '%{value}%')
MainTable:
  Model: User
  Controller:
    AllowViewing: True
    Grid:
      Layout: ADMIN_Users_Grid
    Form:
      Layout: ADMIN_Users_Form
    ToolViews:
      ExportExcel:
        Hint: _(Download to Excel)
        Controller: SCMExcelExport
          ClientFileName: Users.xlsx
          RequireSelection: False
